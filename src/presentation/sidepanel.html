<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kairos</title>
    <link rel="icon" href="../../assets/icons/icon-32.png" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/timer.css" />
    <link rel="stylesheet" href="./css/buttons.css" />
    <link rel="stylesheet" href="./css/todo.css" />
  </head>
  <body>
    <main class="app">
      <header class="head">
        <svg class="head__mark" viewBox="0 0 256 256" aria-hidden="true" focusable="false">
          <g transform="translate(8 0)" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 158 34 C 101 25, 45 63, 32 119 C 17 183, 68 223, 128 221 C 190 219, 226 172, 220 117 C 216 84, 205 66, 194 56" stroke-width="20"/>
            <path d="M 112 69 C 108 94, 108 124, 110 171 M 111 122 C 132 105, 151 88, 169 72 M 112 123 C 133 137, 150 155, 164 173 C 170 181, 178 178, 183 166" stroke-width="18"/>
            <circle cx="179" cy="42" r="7.5" fill="currentColor" stroke="none"/>
          </g>
        </svg>
        <h1>Kairos</h1>
      </header>

      <section class="timer-card" id="timerCard" data-phase="focus">
        <p id="phaseLabel" class="phase">Focus</p>

        <div class="dial-wrap">
          <svg id="dial" class="dial-svg" viewBox="0 0 240 240" role="slider"
               aria-label="Choose focus time" aria-valuemin="10" aria-valuemax="90" aria-valuenow="25">
            <circle class="dial-track" cx="120" cy="120" r="90"></circle>
            <circle id="dialProgress" class="dial-progress" cx="120" cy="120" r="90"></circle>
            <circle id="dialHandle" class="dial-handle" cx="120" cy="30" r="9"></circle>
          </svg>

          <div class="dial-center">
            <p id="dialHint" class="dial-hint">25 min</p>
          </div>
        </div>

        <p id="statusLabel" class="status-badge">Ready</p>
        <p id="cycleLabel" class="cycle"></p>
      </section>

      <section class="actions">
        <!-- Icon-only-Buttons: Bedeutung steckt in aria-label/title, das SVG bleibt dekorativ.
             HTML kann keine Module importieren, deshalb steht das Markup hier direkt —
             zeichengleich mit icon("play"|"skip"|"reset", { size: 20 }) aus js/icons.js
             (kanonische Quelle). Ändert sich dort ein Pfad, hier mitziehen. -->
        <button id="startPauseBtn" class="btn icon-btn primary" aria-label="Start" title="Start"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.8 5.2 18.6 12 7.8 18.8z"/></svg></button>
        <button id="skipBtn"       class="btn icon-btn"         aria-label="Skip"  title="Skip"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 5.5v13L15.5 12z"/><path d="M18 5.5v13"/></svg></button>
        <button id="resetBtn"      class="btn icon-btn danger"  aria-label="Reset" title="Reset"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 8.5-8.5A9.2 9.2 0 0 0 5.6 6.1L3.5 8.1"/><path d="M3.5 3.6v4.7h4.7"/></svg></button>
      </section>

      <p id="saveInfo" class="save-info" aria-live="polite"></p>

      <aside class="todo-card" aria-label="Today's plan and timeline">
        <div class="todo-head">
          <h2>Today's plan</h2>
          <span class="todo-clock" id="todoClock" title="Current time">--:--</span>
        </div>
        <p id="todoDayInfo" class="todo-day-info"></p>

        <div class="todo-input-row">
          <input
            id="todoInput"
            class="todo-input"
            type="text"
            placeholder="Add a task…"
            maxlength="120"
            aria-label="Enter a task"
          />
          <button id="todoAddBtn" class="todo-add-btn" aria-label="Add" title="Add"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
        </div>

        <!-- Tages-Zeitstrahl: Todos an ihrer Uhrzeit; läuft mit der Systemuhr mit -->
        <div class="todo-timeline" id="todoTimeline" aria-label="Day timeline">
          <div class="todo-timeline__inner" id="todoTimelineInner"></div>
        </div>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>
        <p id="todoEmpty" class="todo-empty">No tasks yet today. Add one and drag it onto the timeline.</p>
      </aside>

    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
