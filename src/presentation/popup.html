<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADHD ポモドーロ</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/timer.css" />
    <link rel="stylesheet" href="./css/buttons.css" />
    <link rel="stylesheet" href="./css/todo.css" />
  </head>
  <body>
    <main class="app">
      <header class="head">
        <h1>ADHD ポモドーロ</h1>
      </header>

      <section class="timer-card" id="timerCard">
        <div class="dial-wrap">
          <svg id="dial" class="dial-svg" viewBox="0 0 240 240" role="slider" aria-label="集中時間をえらぶ">
            <circle class="dial-track" cx="120" cy="120" r="90"></circle>
            <circle id="dialProgress" class="dial-progress" cx="120" cy="120" r="90"></circle>
            <circle id="dialHandle" class="dial-handle" cx="120" cy="30" r="7"></circle>
          </svg>

          <div class="dial-center">
            <p id="phaseLabel" class="phase">集中</p>
            <p id="timeLabel" class="time">25:00</p>
          </div>
        </div>
      </section>

      <section class="actions">
        <button id="startPauseBtn" class="btn icon-btn primary" aria-label="スタート" title="スタート">▶</button>
        <button id="skipBtn"       class="btn icon-btn"         aria-label="スキップ" title="スキップ">⏭</button>
        <button id="resetBtn"      class="btn icon-btn danger"  aria-label="リセット" title="リセット">↺</button>
      </section>

      <p id="saveInfo" class="save-info" aria-live="polite"></p>

      <aside class="todo-card" aria-label="今日のタスクと優先">
        <h2>今日のタスク</h2>
        <p id="todoDayInfo" class="todo-day-info"></p>

        <div class="todo-input-row">
          <input
            id="todoInput"
            class="todo-input"
            type="text"
            placeholder="タスクを追加…"
            maxlength="120"
            aria-label="タスクを入力"
          />
          <button id="todoAddBtn" class="todo-add-btn" aria-label="追加" title="追加">+</button>
        </div>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>
        <p id="todoEmpty" class="todo-empty">今日はまだタスクがありません。</p>
      </aside>

    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
