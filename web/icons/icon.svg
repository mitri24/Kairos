<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ADHD Lernuhr">
  <title>ADHD Lernuhr</title>
  <!-- Papier-Hintergrund -->
  <rect x="0" y="0" width="512" height="512" fill="#FBF7F0"/>
  <!-- Zifferblatt: Terrakotta-Ring auf Papier -->
  <circle cx="256" cy="256" r="176" fill="#FBF7F0" stroke="#a9524a" stroke-width="26"/>
  <!-- Stundenmarken in Terrakotta -->
  <g fill="#a9524a">
    <circle cx="256" cy="108" r="11"/>
    <circle cx="256" cy="404" r="11"/>
    <circle cx="108" cy="256" r="11"/>
    <circle cx="404" cy="256" r="11"/>
    <circle cx="361" cy="151" r="8"/>
    <circle cx="151" cy="151" r="8"/>
    <circle cx="361" cy="361" r="8"/>
    <circle cx="151" cy="361" r="8"/>
  </g>
  <!-- Zwei Zeiger in dunkler Tinte -->
  <line x1="256" y1="256" x2="196" y2="176" stroke="#38332C" stroke-width="20" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="336" y2="256" stroke="#38332C" stroke-width="15" stroke-linecap="round"/>
  <!-- Nabe -->
  <circle cx="256" cy="256" r="18" fill="#38332C"/>
  <circle cx="256" cy="256" r="7" fill="#a9524a"/>
</svg>
